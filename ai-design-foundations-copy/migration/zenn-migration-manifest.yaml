    source_sha256: b3f1cf8c0854d41349bfb98459e8bf4312c3b84ff0603e503988b69a021cb192
    original_frontmatter:
      title: 『生成AIを業務へ組み込む設計原則 ― AI・人間・既存システムの責任をどう分けるか』
      summary: |-
        生成AIは、文章作成、情報検索、判断支援、コード生成、既存システムの操作まで、さまざまな作業を自動化できるようになりました。

        しかし、AIが実行できることと、業務として任せられることは同じではありません。

        AIを本番業務へ組み込むには、次のような設計が必要です。

        * AIにどこまで任せるのか
        * どの条件で人間へ処理を戻すのか
        * 誰が結果を確認し、承認するのか
        * AIの品質をどう評価するのか
        * 既存システムとどう接続するのか
        * 問題が起きたとき、誰が責任を持つのか

        これらは、モデルの性能やプロンプトの工夫だけでは解決できません。

        本書では、生成AIの操作方法ではなく、

        > **AI・人間・既存システムを、一つの業務システムとしてどう設計するか**

        を考えます。

        第1章では、AIに作業を任せた後も、判断・承認・記録・責任を途切れさせないための設計を扱います。

        第2章では、AIによる生成速度ではなく、確認・修正・レビュー・合意形成まで含めた業務全体で、導入効果を評価する必要性を扱います。

        今後は、Human in the Loop、責任分界、回答しない条件、RAG、AI評価、コンテキスト設計、複数AIの役割分担など、私自身が生成AIを実務へ適用する中で考えてきたテーマを追加していく予定です。

        特定の製品やモデルの操作方法ではなく、技術が変化しても比較的残り続ける設計原則を中心に整理します。

        本書は執筆中です。原則として週1章のペースで更新します。

        AIを「とりあえず使う」段階から、

        > **AIを安全かつ継続的に業務へ組み込める状態を設計する段階へ。**

        そのために必要な設計を、一つずつ考えていきます。
